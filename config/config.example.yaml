    db-UD: "https://raw.githubusercontent.com/Griffan/VerifyBamID/master/resource/1000g.phase3.100k.b38.vcf.gz.dat.UD"
    db-mu: "https://raw.githubusercontent.com/Griffan/VerifyBamID/master/resource/1000g.phase3.100k.b38.vcf.gz.dat.mu"
    db-bed: "https://raw.githubusercontent.com/Griffan/VerifyBamID/master/resource/1000g.phase3.100k.b38.vcf.gz.dat.bed"
  t2t:
    db-V: "/fsx/Development/estimate-verifybamid2-reference-data-runs/100k/estimate-verifybamid2-reference-data/results/verify_output/1000g.phase3.unrelated.100k.chm13v2.0.V"
    db-UD: "/fsx/Development/estimate-verifybamid2-reference-data-runs/100k/estimate-verifybamid2-reference-data/results/verify_output/1000g.phase3.unrelated.100k.chm13v2.0.UD"
    db-mu: "/fsx/Development/estimate-verifybamid2-reference-data-runs/100k/estimate-verifybamid2-reference-data/results/verify_output/1000g.phase3.unrelated.100k.chm13v2.0.mu"
    db-bed: "/fsx/Development/estimate-verifybamid2-reference-data-runs/100k/estimate-verifybamid2-reference-data/results/verify_output/1000g.phase3.unrelated.100k.chm13v2.0.bed"
