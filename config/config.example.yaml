# This file should contain everything to configure the workflow on a global scale.
# In case of sample based data, it should be complemented by a manifest file that contains
# one row per sample. It can be parsed easily via pandas.
manifest: "config/WES_sbsandme.tsv"
sample-linking:
  sex: "config/WES_sbsandme_sexes.tsv"
  external-ids: "config/WES_sbsandme_external_ids.tsv"
genome-build: "grch38"
apptainer-image-dir: "apptainer_images"

behaviors:
  outcome: "calling"  # fastqc, alignment, calling, or release
  library-type: "WGS"  # WGS, WES, PACBIO, ONT_R104, HYBRID_PACBIO_ILLUMINA, MASSEQ
  use-containers: no
  aligner: "bwa-mem2"  # bwa or bwa-mem2
  qc-type:
    - "lane-specific"
    - "combined-lanes"  # Comment-out for single-lane libraries
  bqsr: yes
  snv-caller: "deepvariant"
  sv-endpoints:
    strict:
      sv-callers:
        - "manta"
        - "lumpy"
        - "delly"
      sv-ensemble:
        min-count: 2
      sv-remove-breakends: yes
    lenient:
      sv-callers:
        - "manta"
      sv-ensemble:
        min-count: 1
      sv-remove-breakends: yes
  symlink-fastqs: yes  # For local filesystem fastqs, no need to copy them
  assume-single-lane: no # Edit in conjunction with qc-type
  remove-duplicates: yes  # Saves bam space for now
  import-s3:
    profile-name: "default"
  export-directory: "exports/"
  export-s3:
    bucket-name: "s3://pmgrc-gregor-data/wgs-short-read/idedios_demos"
    profile-name: "default"

parameters:
  bwa:
    K: 120000000
  bwa-mem2:
    K: 120000000
  deepvariant:
    number-shards: 16
    docker-version: "1.5.0"  # Plan to upgrade to 1.8.0 but currently there are issues with make_examples
  gatk-collectwgsmetrics:
    read-length: 300  # Set read lengths here
  manta:
    config-ini: "config/configManta.py.ini"
  tiddit:
    min-contig-size: 2000000

references:
  grch38:
    probes-bed: "resources/xgen-exome-hyb-panel-v2-probes-hg38.bed"
    targets-bed: "resources/xgen-exome-hyb-panel-v2-targets-hg38.bed"
    fasta: "ftp://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/001/405/GCA_000001405.15_GRCh38/seqs_for_alignment_pipelines.ucsc_ids/GCA_000001405.15_GRCh38_no_alt_analysis_set.fna.gz"
    exclusion-regions-bed: "resources/grch38_encodelist_centromeres_telomeres.bed"
    exons-gtf-gz: "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/genes/hg38.ncbiRefSeq.gtf.gz"
  t2t:
    fasta: "https://s3-us-west-2.amazonaws.com/human-pangenomics/T2T/CHM13/assemblies/analysis_set/chm13v2.0.fa.gz"
    exclusion-regions-bed: "resources/t2t_centromeres_telomeres.bed"
bqsr:
  grch38:
    known-indels-vcf-gz: "s3://broad-references/hg38/v0/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"
    known-indels-vcf-gz-tbi: "s3://broad-references/hg38/v0/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz.tbi"
    dbsnp138-vcf: "s3://broad-references/hg38/v0/Homo_sapiens_assembly38.dbsnp138.vcf"
    dbsnp138-vcf-idx: "s3://broad-references/hg38/v0/Homo_sapiens_assembly38.dbsnp138.vcf.idx"
verifybamid2:
